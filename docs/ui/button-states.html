<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Got it · 按钮状态总览</title><style>@layer reader-base {

body,

}

body {

}

input,
textarea {

}

}

.brand-mark {

  height: 29px;

}

.icon-button {

  align-items: center;
  justify-content: center;
  width: 32px;
  height: 32px;
  padding: 0;
  border: 1px solid transparent;
  border-radius: 9px;
  background: transparent;
  cursor: pointer;
}

.icon-button:hover {

}

.sidebar-close {
  display: none;
  margin-left: auto;
}

.import-card {
  display: grid;
  grid-template-columns: 31px 1fr 16px;
  align-items: center;
  gap: 9px;
  margin: 14px 12px 10px;
  padding: 10px;

  border: 1px solid var(--line);
  border-radius: 12px;

.import-card:hover {

.import-card > span:nth-child(2) {

.import-icon {

  justify-content: center;

  height: 31px;

}

.sidebar-scroll {

}

.nav-section + .nav-section {

}

.section-label {

}

.outline-list {

  gap: 2px;
}

.outline-item {
  overflow: hidden;

  line-height: 1.35;

.outline-item:hover {

}

}

.nav-empty {

}

.reader-column {
  display: flex;

}

.reader-toolbar {

}

}

.toolbar-title > div {

}

.toolbar-title strong {

  font-size: 12px;
  font-weight: 650;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.toolbar-title span {

}

}

.toolbar-button,

.toolbar-button:hover,

}

}

.provider-popover {

.popover-head {

.provider-list {

}

.availability-label {

.reader-scroll {

.demo-document-note span {

}

.markdown-article {

  margin: 0 auto;
  padding: 40px 40px 80px;

.markdown-article > :first-child {

.markdown-article h1,
.markdown-article h2,
.markdown-article h3,
.markdown-article h4 {

}

.markdown-article h1 {

}

.markdown-article h2 {

  padding-top: 4px;

}



.markdown-article h3 {

  font-size: 19px;
  font-weight: 680;
}

.markdown-article h4 {
  margin: 28px 0 10px;
  font-size: 16px;
}

.markdown-article p {
  margin: 0 0 18px;
}

.markdown-article strong {
  color: #111216;
  font-weight: 690;
}

.markdown-article a {
  color: var(--blue-strong);

}

.markdown-article blockquote {

}

.markdown-article blockquote p:last-child {

}

.markdown-article ul,

}

}

.markdown-article table {

.markdown-article th,

.markdown-article th {

.markdown-article pre {

.markdown-article code {

.markdown-article img {

}

/* Keep ink and geometry stable; cloned dashed edges identify each line fragment. */
.markdown-article mark[data-focus-stickies-highlight] {
  margin: 0 -1px;
  padding: 0 0 1px;
  border: 1px dashed transparent;
  color: inherit;
  border-radius: 3px 2px 4px 2px;
  background-color: #e4e3f9;
  background-image:
    linear-gradient(to right, #c0bee9, #c6c3ec 15.4%, #d0cef1 46.2%, #e4e3f9),
    linear-gradient(to left, #bebbe7, #c3c0ea 16.7%, #d0cef1 50%, #e4e3f9);
  background-size: min(13px, 30%) 100%, min(12px, 30%) 100%;
  background-origin: border-box;
  background-position: left center, right center;
  background-repeat: no-repeat;
  box-shadow: none;
  cursor: pointer;
  box-decoration-break: clone;
  -webkit-box-decoration-break: clone;
}
.markdown-article mark[data-focus-stickies-highlight]:hover {
  border-color: #aaa6ce;
}
.markdown-article mark[data-focus-stickies-highlight].is-emphasized {

.focus-ring,

}

.anchor-meta span:first-child {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  color: var(--blue);
  font-weight: 650;
}

.anchor-meta span:last-child {
  overflow: hidden;
  max-width: 170px;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.anchor-card blockquote {
  margin: 11px 0 0;
  color: #35373d;
  font-size: 12px;
  font-weight: 560;
  line-height: 1.65;
}

.anchor-warning {
  display: flex;
  align-items: center;
  gap: 5px;
  margin: 9px 0 0;
  color: var(--amber);
  font-size: 12px;
}

.thread-messages {
  display: grid;
  gap: 12px;
  margin-top: 14px;
}

.user-message {
  display: grid;
  grid-template-columns: 22px 1fr;
  gap: 8px;
  align-items: start;
}

.user-message > span {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 22px;
  height: 22px;
  color: #fff;
  font-size: 12px;
  border-radius: 7px;
  background: #282a2f;
}

.user-message p {
  margin: 0;
  padding: 9px 11px;
  color: #4b4e55;
  font-size: 12px;
  line-height: 1.6;
  border: 1px solid var(--line);
  border-radius: 4px 11px 11px;
  background: #fff;
}

.assistant-message {
  padding: 13px;
  border: 1px solid var(--line);
  border-radius: 12px;
  background: #fff;
}

.assistant-message > header {
  display: grid;
  grid-template-columns: 28px 1fr auto;
  gap: 8px;
  align-items: center;
  margin-bottom: 12px;
}

.assistant-avatar {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 28px;
  height: 28px;
  color: var(--blue);
  border-radius: 9px;
  background: var(--blue-soft);
}

.assistant-message > header > div {
  display: grid;
  gap: 1px;
}

.assistant-message > header strong {
  font-size: 12px;
}

.assistant-message > header small {
  color: var(--muted-2);
  font-size: 7px;
}

.evidence-badge {
  padding: 4px 6px;
  font-size: 7px;
  font-weight: 600;
  border: 1px solid var(--line);
  border-radius: 6px;
  background: #f7f7f5;
}

.evidence-supported {
  color: var(--green);
  border-color: #c8e8d6;
  background: var(--green-soft);
}

.evidence-partial,
.evidence-unsupported {
  color: var(--amber);
  border-color: #efd7a6;
  background: var(--amber-soft);
}

.evidence-neutral {
  color: #646975;
}

.demo-answer-label {
  display: flex;
  align-items: center;
  gap: 5px;
  margin: -2px 0 10px;
  padding: 6px 7px;
  color: #746124;
  font-size: 12px;
  border: 1px solid #eee1af;
  border-radius: 7px;
  background: #fff9df;
}

.answer-markdown {
  color: #363941;
  font-size: 12px;
  line-height: 1.72;
}

.answer-markdown > :first-child {
  margin-top: 0;
}

.answer-markdown > :last-child {
  margin-bottom: 0;
}

.answer-markdown h1,
.answer-markdown h2,
.answer-markdown h3 {
  margin: 16px 0 7px;
  color: var(--ink);
  font-size: 12px;
}

.answer-markdown p {
  margin: 0 0 10px;
}

.answer-markdown ul,
.answer-markdown ol {
  margin: 7px 0 10px;
  padding-left: 18px;
}

.answer-markdown li {
  margin: 4px 0;
}

.answer-markdown strong {
  color: #1d1e22;
  font-weight: 680;
}

.answer-markdown code {
  padding: 1px 4px;
  font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  font-size: 12px;
  border-radius: 4px;
  background: #f0f1f3;
}

.source-section {
  display: grid;
  gap: 7px;
  margin-top: 14px;
  padding-top: 12px;
  border-top: 1px solid var(--line);
}

.source-heading {
  display: flex;
  justify-content: space-between;
  color: var(--muted-2);
  font-size: 12px;
  font-weight: 650;
  letter-spacing: 0.05em;
  text-transform: uppercase;
}

.source-card {
  display: grid;
  grid-template-columns: 25px 1fr 13px;
  gap: 8px;
  align-items: start;
  padding: 8px;
  color: inherit;
  text-decoration: none;
  border: 1px solid var(--line);
  border-radius: 9px;
  background: #fafaf9;
}

.source-card:hover {
  border-color: #cfd4f3;
  background: #f7f8ff;
}

.source-favicon {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 25px;
  height: 25px;
  color: #4c577e;
  font-size: 12px;
  font-weight: 700;
  border: 1px solid #d9ddec;
  border-radius: 7px;
  background: #fff;
}

.source-card > span:nth-child(2) {
  display: grid;
  gap: 2px;
  min-width: 0;
}

.source-card strong {
  overflow: hidden;
  font-size: 12px;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.source-card small {
  color: var(--muted-2);
  font-size: 7px;
}

.source-card p {
  display: -webkit-box;
  margin: 4px 0 0;
  overflow: hidden;
  color: var(--muted);
  font-size: 12px;
  line-height: 1.4;
  -webkit-box-orient: vertical;
  -webkit-line-clamp: 2;
}

.source-card > svg {
  color: var(--muted-2);
}

.no-source-note {
  display: flex;
  align-items: center;
  gap: 6px;
  margin-top: 12px;
  padding-top: 10px;
  color: var(--amber);
  font-size: 12px;
  border-top: 1px solid var(--line);
}

.thinking-card {
  display: grid;
  grid-template-columns: 29px 1fr auto;
  gap: 10px;
  align-items: center;
  padding: 12px;
  border: 1px solid #dde1f4;
  border-radius: 11px;
  background: #f4f5f8;
}

.thinking-card > div {
  display: grid;
  gap: 2px;
}

.thinking-card strong {
  font-size: 12px;
  font-weight: 600;
}

.thinking-card small,
.thinking-card time {
  color: var(--muted-2);
  font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  font-size: 7px;
  font-style: normal;
}

.pixel-loader {
  display: grid;
  grid-template-columns: repeat(3, 3px);
  grid-template-rows: repeat(3, 3px);
  gap: 2px;
  place-content: center;
  width: 29px;
  height: 29px;
}

.pixel-loader i {
  width: 3px;
  height: 3px;
  border-radius: 1px;
  background: #9da2af;
  animation: pixel-wave 1.2s ease-in-out infinite;
}

.pixel-loader i:nth-child(2),
.pixel-loader i:nth-child(4) { animation-delay: 0.12s; }
.pixel-loader i:nth-child(3),
.pixel-loader i:nth-child(5),
.pixel-loader i:nth-child(7) { animation-delay: 0.24s; }
.pixel-loader i:nth-child(6),
.pixel-loader i:nth-child(8) { animation-delay: 0.36s; }
.pixel-loader i:nth-child(9) { animation-delay: 0.48s; }

.error-card {
  display: grid;
  grid-template-columns: 17px 1fr auto;
  gap: 8px;
  align-items: start;
  padding: 11px;
  color: #7f3e3e;
  border: 1px solid #edcccc;
  border-radius: 10px;
  background: #fff5f5;
}

.error-card > div {
  display: grid;
  gap: 3px;
}

.error-card strong {
  font-size: 12px;
}

.error-card p {
  margin: 0;
  font-size: 12px;
  line-height: 1.4;
}

.error-card button {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 4px 6px;
  color: inherit;
  font-size: 12px;
  border: 1px solid #e1b6b6;
  border-radius: 6px;
  background: #fff;
  cursor: pointer;
}

.understanding-card {
  margin-top: 16px;
  padding: 13px;
  border: 1px solid #d9def7;
  border-radius: 12px;
  background: #f8f9ff;
}

.understanding-head {
  display: flex;
  justify-content: space-between;
  margin-bottom: 8px;
  color: var(--muted-2);
  font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  font-size: 7px;
}

.step-number {
  color: var(--blue);
  font-family: inherit;
  font-weight: 650;
  letter-spacing: 0.04em;
  text-transform: uppercase;
}

.understanding-card label {
  display: block;
  margin-bottom: 7px;
  font-size: 12px;
  font-weight: 650;
}

.understanding-card textarea {
  width: 100%;
  min-height: 82px;
  padding: 9px 10px;
  resize: vertical;
  color: #34373e;
  font-size: 12px;
  line-height: 1.6;
  border: 1px solid #d9ddec;
  border-radius: 9px;
  outline: 0;
  background: #fff;
}

.understanding-card textarea:focus {
  border-color: var(--blue);
  box-shadow: 0 0 0 3px rgba(83, 109, 254, 0.08);
}

.understanding-card textarea::placeholder {
  color: #b0b3ba;
}

.understanding-card p {
  display: flex;
  align-items: flex-start;
  gap: 5px;
  margin: 7px 0 0;
  color: var(--muted-2);
  font-size: 7px;
  line-height: 1.45;
}

.inquiry-actions {
  flex: 0 0 auto;
  padding: 11px 13px 13px;
  border-top: 1px solid var(--line);
  background: rgba(247, 247, 245, 0.96);
}

.followup-composer {
  display: grid;
  grid-template-columns: 1fr 28px;
  gap: 6px;
  align-items: end;
  padding: 6px 6px 6px 10px;
  border: 1px solid var(--line-strong);
  border-radius: 12px;
  background: #fff;
}

.followup-composer:focus-within {
  border-color: #bdc6fc;
  box-shadow: 0 0 0 3px rgba(83, 109, 254, 0.07);
}

.followup-composer textarea {
  width: 100%;
  height: 30px;
  max-height: 80px;
  padding: 6px 0;
  resize: none;
  font-size: 12px;
  line-height: 1.5;
  border: 0;
  outline: 0;
  background: transparent;
}

.followup-composer textarea::placeholder {
  color: #aaaeb5;
}

.followup-composer > button {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 28px;
  height: 28px;
  color: #fff;
  border: 0;
  border-radius: 8px;
  background: #222429;
  cursor: pointer;
}

.followup-composer > button:disabled {
  color: #b7bac0;
  background: #ebebea;
  cursor: default;
}

.closure-actions {
  display: grid;
  grid-template-columns: auto auto 1fr;
  gap: 6px;
  margin-top: 8px;
}

.secondary-action,
.primary-action {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 5px;
  min-height: 31px;
  padding: 0 9px;
  font-size: 12px;
  font-weight: 600;
  border-radius: 8px;
  cursor: pointer;
}

.secondary-action {
  color: #5b5f68;
  border: 1px solid var(--line-strong);
  background: #fff;
}

.secondary-action:hover {
  background: #f3f3f1;
}

.secondary-action.full {
  width: 100%;
}

.primary-action {
  color: #fff;
  border: 1px solid var(--blue-strong);
  background: var(--blue);
}

.primary-action:hover {
  background: var(--blue-strong);
}

.selection-toolbar {
  position: fixed;
  z-index: 100;
  width: min(470px, calc(100vw - 24px));
  overflow: hidden;
  border: 1px solid #d6d8df;
  border-radius: 13px;
  background: #fff;
  box-shadow: var(--shadow-float);
  transform: translateX(-50%);
  animation: pop-in 130ms ease-out;
}

.selection-quote {
  overflow: hidden;
  padding: 8px 11px 7px;
  color: #777b84;
  font-size: 12px;
  text-overflow: ellipsis;
  white-space: nowrap;
  border-bottom: 1px solid var(--line);
  background: #fafaf9;
}

.selection-actions {
  display: grid;
  grid-template-columns: repeat(4, 1fr) 29px;
  gap: 3px;
  padding: 5px;
}

.selection-actions button {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 5px;
  min-height: 31px;
  padding: 0 7px;
  font-size: 12px;
  font-weight: 600;
  border: 0;
  border-radius: 7px;
  background: transparent;
  cursor: pointer;
}

.selection-actions button:hover {
  color: var(--blue-strong);
  background: var(--blue-soft);
}

.selection-actions .selection-close {
  padding: 0;
  color: var(--muted-2);
}

.drop-overlay {
  position: absolute;
  z-index: 150;
  inset: 10px;
  display: grid;
  place-items: center;
  border: 2px dashed #97a6ff;
  border-radius: 18px;
  background: rgba(247, 248, 255, 0.92);
  backdrop-filter: blur(10px);
  pointer-events: none;
}

.drop-overlay > div {
  display: grid;
  justify-items: center;
  gap: 8px;
  padding: 30px;
  color: var(--blue);
  border-radius: 16px;
  background: #fff;
  box-shadow: 0 18px 50px rgba(48, 61, 127, 0.12);
}

.drop-overlay strong {
  color: var(--ink);
  font-size: 14px;
}

.drop-overlay span {
  color: var(--muted);
  font-size: 12px;
}

.toast {
  position: fixed;
  z-index: 200;
  bottom: 20px;
  left: 50%;
  max-width: min(440px, calc(100vw - 28px));
  padding: 10px 14px;
  color: #fff;
  font-size: 12px;
  line-height: 1.45;
  border: 1px solid rgba(255, 255, 255, 0.12);
  border-radius: 9px;
  background: rgba(28, 29, 33, 0.94);
  box-shadow: 0 10px 35px rgba(19, 20, 25, 0.22);
  transform: translateX(-50%);
  animation: toast-in 160ms ease-out;
}

.drawer-navigation-trigger,
.drawer-results-trigger,
.mobile-scrim {
  display: none;
}

.spin {
  animation: spin 1s linear infinite;
}

@keyframes spin {
  to { transform: rotate(360deg); }
}

@keyframes orbit {
  to { transform: translate(-50%, -50%) rotate(360deg); }
}

@keyframes pulse {
  50% { opacity: 0.35; }
}

@keyframes pixel-wave {
  0%, 100% { opacity: 0.25; transform: scale(0.8); }
  50% { opacity: 1; transform: scale(1); }
}

@keyframes pop-in {
  from { opacity: 0; transform: translateX(-50%) translateY(-4px) scale(0.985); }
}

@keyframes toast-in {
  from { opacity: 0; transform: translateX(-50%) translateY(6px); }
}

@media (max-width: 1260px) {
  .app-frame {
    --left-width: 216px;
    --right-width: 396px;
  }

  .markdown-article {
    padding-inline: 32px;
  }

  .toolbar-title strong {
    max-width: 220px;
  }
}

@media (max-width: 1080px) {
  .app-frame {
    --right-width: 396px;
    grid-template-columns: minmax(0, 1fr) var(--right-width);
  }

  .left-sidebar {
    position: absolute;
    top: 0;
    bottom: 0;
    left: 0;
    z-index: 90;
    width: 242px;
    border-right-color: var(--line-strong);
    box-shadow: 14px 0 42px rgba(31, 34, 43, 0.12);
    transform: translateX(-104%);
    transition: transform 180ms ease;
  }

  .sidebar-open .left-sidebar {
    transform: translateX(0);
  }

  .sidebar-close,
  .drawer-navigation-trigger {
    display: inline-flex;
  }

  .mobile-scrim {
    position: absolute;
    z-index: 80;
    inset: 0;
    display: block;
    border: 0;
    background: rgba(25, 27, 33, 0.18);
    backdrop-filter: blur(1px);
  }
}

@media (max-width: 780px) {
  .drawer-results-trigger { display: inline-flex; }

  .app-frame {
    display: block;
    border: 0;
  }

  .reader-column {
    width: 100%;
    height: 100%;
  }

  .right-panel {
    position: absolute;
    z-index: 100;
    top: 0;
    right: 0;
    bottom: 0;
    width: min(420px, 94vw);
    border-left-color: var(--line-strong);
    box-shadow: -14px 0 42px rgba(31, 34, 43, 0.12);
    transform: translateX(104%);
    transition: transform 180ms ease;
  }

  .panel-open .right-panel {
    transform: translateX(0);
  }

  .panel-mobile-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    min-height: 43px;
    padding: 0 13px;
    color: var(--muted);
    font-size: 12px;
    border-bottom: 1px solid var(--line);
    background: #fff;
  }

  .inquiry-panel-content,
  .empty-panel {
    height: calc(100% - 43px);
  }

  .reader-toolbar {
    padding-inline: 11px;
  }

  .toolbar-title > svg {
    display: none;
  }

  .toolbar-button span {
    display: none;
  }

  .toolbar-button {
    width: 32px;
    padding: 0;
    justify-content: center;
  }

  .markdown-article {
    width: min(100%, 720px);
    padding-inline: 32px;
  }

  .demo-document-note {
    margin-inline: 20px;
  }
}

@media (max-width: 560px) {
  .reader-toolbar {
    min-height: 57px;
    flex-basis: 57px;
  }

  .toolbar-title strong {
    max-width: 145px;
  }

  .toolbar-title span,
  .provider-trigger > span:first-of-type,
  .provider-trigger > svg:last-child {
    display: none;
  }

  .provider-trigger {
    width: 32px;
    padding: 0;
    justify-content: center;
  }

  .provider-trigger .connection-dot {
    position: absolute;
    top: 6px;
    right: 5px;
    width: 5px;
    height: 5px;
  }

  .provider-popover {
    position: fixed;
    top: 64px;
    right: 8px;
    left: 8px;
    width: auto;
  }

  .demo-document-note {
    align-items: flex-start;
    margin: 15px 12px 0;
    line-height: 1.45;
  }

  .demo-document-note button {
    display: none;
  }

  .markdown-article {
    padding: 36px 21px 75px;
    font-size: 14px;
    line-height: 1.84;
  }

  .markdown-article h1 {
    font-size: 30px;
  }

  .markdown-article h2 {
    margin-top: 49px;
    font-size: 22px;
  }

  .markdown-article table {
    display: block;
    overflow-x: auto;
    white-space: normal;
  }

  .selection-toolbar {
    right: 8px;
    bottom: 10px;
    left: 8px !important;
    top: auto !important;
    width: auto;
    transform: none;
  }

  .selection-actions {
    grid-template-columns: repeat(2, 1fr) 29px;
  }

  .selection-actions .selection-close {
    grid-column: 3;
    grid-row: 1 / span 2;
    height: 100%;
  }

  .closure-actions {
    grid-template-columns: 1fr 1fr;
  }

  .primary-action {
    grid-column: 1 / -1;
  }

  .empty-panel {
    padding-top: 55px;
  }
}

@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    scroll-behavior: auto !important;
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
  }
}

/* Guided closure: fixed choices keep attention on the current anchor. */
.guided-actions { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.guided-actions button { min-height: 38px; font-size: 12px; }
.guided-actions .primary-action { grid-column: auto; }
.guided-actions button:disabled { opacity: .45; cursor: not-allowed; }
.guided-hint { margin: 0 0 10px; color: var(--muted); font-size: 12px; }
.completion-note { display: flex; align-items: center; justify-content: center; gap: 6px; font-size: 12px; }

/* Evidence remains readable inside the existing narrow discussion panel. */
.verification-status-row { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px; margin: 0 0 12px; }
.verification-status-row .evidence-badge { padding: 3px 8px; font-size: 13px; line-height: 1.75; }
.search-trace { color: #596159; font-size: 13px; line-height: 1.75; }
.search-trace small { display: inline; margin-left: 8px; font-size: inherit; }
.recheck-unavailable { color: #596159; font-size: 13px; line-height: 1.5; margin: 8px 0 0; }
.source-evidence-card { min-width: 0; border: 1px solid #e2e5de; border-radius: 10px; padding: 12px; margin-top: 8px; background: #fff; }
.source-evidence-heading { display: flex; flex-direction: column; gap: 4px; overflow-wrap: anywhere; }
.source-evidence-heading strong { font-size: 13px; line-height: 1.5; }
.source-evidence-heading small, .source-details { color: #6d756c; font-size: 12px; }
.source-url { display: block; margin: 7px 0 10px; color: #365fcc; overflow-wrap: anywhere; font-size: 12px; line-height: 1.6; }
.excerpt-label { font-size: 12px; color: #826325; background: #faf3e2; border-radius: 4px; padding: 3px 6px; }
.excerpt-label.verified { color: #35744b; background: #edf6ee; }
.source-evidence-card blockquote { margin: 10px 0; padding: 0 0 0 10px; border-left: 2px solid #bbc6b8; color: #3d443b; font-size: 12px; line-height: 1.8; overflow-wrap: anywhere; user-select: text; }
.source-relation { font-size: 12px; margin: 7px 0; color: #596159; }
.source-details { display: block; margin: 5px 0; }
.source-actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 12px; }
.source-actions a, .source-actions button { display: inline-flex; align-items: center; gap: 4px; background: none; border: 0; padding: 3px 0; color: #365fcc; font: inherit; font-size: 12px; cursor: pointer; text-decoration: none; }

/* Compact browser-style category tabs. */

/* One selection language for Markdown, PDF text and image regions. */

}

 .panel-resize-handle:hover::after, .panel-resize-handle:focus-visible::after, .panel-resizing .panel-resize-handle::after { background:#8a83df; }
 .panel-resize-handle:focus-visible { outline:2px solid #8a83df; outline-offset:-2px; }

t\">\u003cbutton type=\"button\" class=\"recovery-primary\" >使用当前记录\u003c/button>\u003c/div>\u003c/div>","note":""},{"group":"设置与恢复","name":"恢复记录 · 继续当前阅读","html":"\u003cdiv class=\"library-state demo-context\">\u003cdiv class=\"recovery-dialog demo-context\">\u003cbutton type=\"button\" class=\"recovery-primary\" >继续当前阅读\u003c/button>\u003c/div>\u003c/div>","note":""},{"group":"设置与恢复","name":"重试保存","html":"\u003cdiv class=\"library-state demo-context\">\u003cbutton type=\"button\" class=\"\" >重试保存\u003c/button>\u003c/div>","note":""},{"group":"设置与恢复","name":"重新连接","html":"\u003cdiv class=\"library-state demo-context\">\u003cbutton type=\"button\" class=\"\" >重新连接\u003c/button>\u003c/div>","note":""},{"group":"设置与恢复","name":"重新选择文件","html":"\u003cdiv class=\"library-state demo-context\">\u003cbutton type=\"button\" class=\"\" >重新选择文件\u003c/button>\u003c/div>","note":""},{"group":"设置与恢复","name":"关闭提示","html":"\u003cdiv class=\"library-state demo-context\">\u003cbutton type=\"button\" class=\"\" >关闭提示\u003c/button>\u003c/div>","note":""},{"group":"设置与恢复","name":"找回阅读记录","html":"\u003cdiv class=\"library-state demo-context\">\u003cbutton type=\"button\" class=\"\" >找回阅读记录\u003c/button>\u003c/div>","note":""},{"group":"设置与恢复","name":"重试读取","html":"\u003cdiv class=\"library-state demo-context\">\u003cbutton type=\"button\" class=\"\" >重试读取\u003c/button>\u003c/div>","note":""},{"group":"设置与恢复","name":"重新定位","html":"\u003cdiv class=\"library-state demo-context\">\u003cbutton type=\"button\" class=\"\" >重新定位\u003c/button>\u003c/div>","note":""},{"group":"设置与恢复","name":"关联原文件","html":"\u003cdiv class=\"library-state demo-context\">\u003cbutton type=\"button\" class=\"\" >关联原文件\u003c/button>\u003c/div>","note":""},{"group":"设置与恢复","name":"使用更新后的原文","html":"\u003cdiv class=\"library-state demo-context\">\u003cbutton type=\"button\" class=\"\" >使用更新后的原文\u003c/button>\u003c/div>","note":""},{"group":"设置与恢复","name":"换成我的文档","html":"\u003cdiv class=\"demo-document-note demo-context\">\u003cbutton type=\"button\" class=\"\" >换成我的文档\u003c/button>\u003c/div>","note":""},{"group":"设置与恢复","name":"展开项 · 模型设置","html":"\u003cdetails class=\"demo-details\">\u003csummary>模型设置\u003c/summary>\u003c/details>","note":"展开项没有禁用态"},{"group":"设置与恢复","name":"展开项 · 历史回答","html":"\u003cdetails class=\"demo-details\">\u003csummary>历史回答\u003c/summary>\u003c/details>","note":"展开项没有禁用态"},{"group":"设置与恢复","name":"展开项 · 查看记录差异","html":"\u003cdetails class=\"demo-details\">\u003csummary>查看记录差异\u003c/summary>\u003c/details>","note":"展开项没有禁用态"},{"group":"设置与恢复","name":"展开项 · 查看所选内容","html":"\u003cdetails class=\"demo-details\">\u003csummary>查看所选内容\u003c/summary>\u003c/details>","note":"展开项没有禁用态"}];const groups=[...new Set(rows.map(r=>r.group))];const labels=['默认 Default','悬停 Hover','按住 Active','禁用 Disabled','亲自试一试'];const states=['default','hover','active','disabled','live'];
const groupSelect=document.querySelector('#group');for(const group of groups){const o=document.createElement('option');o.value=group;o.textContent=group;groupSelect.append(o)}
function render(){const query=document.querySelector('#search').value.trim().toLowerCase(),category=groupSelect.value;const found=rows.filter(r=>(!category||r.group===category)&&(!query||(r.group+' '+r.name+' '+r.note).toLowerCase().includes(query)));document.querySelector('#stats').textContent=found.length+' / '+rows.length+' 个按钮样例';const root=document.querySelector('#catalog');root.replaceChildren();for(const group of groups){const items=found.filter(r=>r.group===group);if(!items.length)continue;const section=document.createElement('section');section.className='group';const title=document.createElement('h2');title.textContent=group;section.append(title);const matrix=document.createElement('div');matrix.className='matrix';const head=document.createElement('div');head.className='matrix-head';for(const text of ['按钮 / 用途',...labels]){const d=document.createElement('div');d.textContent=text;head.append(d)}matrix.append(head);for(const item of items){const row=document.createElement('div');row.className='sample-row';const name=document.createElement('div');name.className='row-title';name.textContent=item.name;if(item.note){const small=document.createElement('small');small.textContent=item.note;name.append(small)}row.append(name);states.forEach((state,index)=>{const cell=document.createElement('div');cell.className='cell'+(state==='live'?' live':'');const lab=document.createElement('span');lab.className='cell-label';lab.textContent=labels[index];cell.append(lab);const preview=document.createElement('div');preview.className='preview';preview.innerHTML=item.html;const target=preview.querySelector('button,summary,img[role=button]');if(state==='disabled'&&target.tagName!=='BUTTON'){const na=document.createElement('span');na.className='na';na.textContent='不适用';cell.append(na)}else{if(state!=='live'){target.dataset.previewState=state;target.tabIndex=-1;if(state==='disabled')target.disabled=true}else{target.dataset.live='true';target.setAttribute('aria-label',item.name+'（视觉预览）')}cell.append(preview)}row.append(cell)});matrix.append(row)}section.append(matrix);root.append(section)}if(!found.length){const empty=document.createElement('div');empty.className='empty';empty.textContent='没有匹配的按钮';root.append(empty)}}
document.querySelector('#search').addEventListener('input',render);groupSelect.addEventListener('change',render);let timer;document.querySelector('#catalog').addEventListener('click',e=>{const target=e.target.closest('button,summary,img[role=button]');if(!target)return;if(!target.dataset.live){e.preventDefault();return}if(target.tagName!=='SUMMARY')e.preventDefault();const tip=document.querySelector('#tip');tip.textContent='仅预览反馈，不执行实际操作';tip.hidden=false;clearTimeout(timer);timer=setTimeout(()=>tip.hidden=true,1400)});render();
</script></html>
